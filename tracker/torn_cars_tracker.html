// ---- State ----
let obtained       = {};
let filterClass    = 'all';
let filterObtained = 'all';
let sortCol        = 'name';
let sortAsc        = true;
let csvFileHandle  = null; // persisted in IndexedDB

// ---- IndexedDB ----
async function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('torn_cars_db', 2);
    req.onupgradeneeded = e => {
      if (!e.target.result.objectStoreNames.contains('handles'))
        e.target.result.createObjectStore('handles');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = () => reject(req.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction('handles').objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror   = () => reject(req.error);
  });
}
async function dbSet(key, val) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = resolve;
    tx.onerror    = () => reject(tx.error);
  });
}

// ---- CSV ----
function buildCSV() {
  const rows = ['id,name,class,location,buy,sell,obtained'];
  cars.forEach(c => {
    rows.push(`${c.id},"${c.name}",${c.cls},"${c.location}",${c.buy ?? ''},${c.sell ?? ''},${!!obtained[c.id]}`);
  });
  return rows.join('\r\n');
}

function parseCSV(text) {
  const lines  = text.trim().split(/\r?\n/);
  const cols   = lines[0].toLowerCase().split(',');
  const idIdx  = cols.indexOf('id');
  const obtIdx = cols.indexOf('obtained');
  if (idIdx < 0 || obtIdx < 0) return;
  obtained = {};
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(',');
    const id    = parts[idIdx]?.replace(/"/g, '').trim();
    const got   = parts[obtIdx]?.replace(/"/g, '').trim().toLowerCase();
    if (id && got === 'true') obtained[id] = true;
  }
}

// ---- File handle ----
function setCsvInfo(text, linked) {
  const el = document.getElementById('csvInfo');
  el.textContent = text;
  el.className = 'csv-info' + (linked ? ' linked' : '');
}

async function loadFromCSV() {
  // Try to read from stored file handle silently on page load
  if (!('showOpenFilePicker' in window)) return;
  try {
    csvFileHandle = await dbGet('csvFile');
    if (!csvFileHandle) return;
    const perm = await csvFileHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setCsvInfo('torn_cars.csv (click Save to reconnect)', false);
      return;
    }
    const text = await (await csvFileHandle.getFile()).text();
    parseCSV(text);
    setCsvInfo('torn_cars.csv', true);
  } catch (e) {
    csvFileHandle = null;
    console.warn('Load from CSV failed:', e);
  }
}

async function saveToCSV() {
  if (!('showOpenFilePicker' in window)) {
    // Fallback: download
    const url = URL.createObjectURL(new Blob([buildCSV()], { type: 'text/csv' }));
    Object.assign(document.createElement('a'), { href: url, download: 'torn_cars.csv' }).click();
    URL.revokeObjectURL(url);
    flash('Downloaded!');
    return;
  }

  // If we don't have a valid handle, open the file picker
  if (!csvFileHandle) {
    try {
      const [fh] = await window.showOpenFilePicker({
        types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'], 'text/plain': ['.csv'] } }],
      });
      const perm = await fh.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return;
      csvFileHandle = fh;
      await dbSet('csvFile', fh);
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
      return;
    }
  }

  // Check / re-request permission if needed
  const perm = await csvFileHandle.queryPermission({ mode: 'readwrite' });
  if (perm !== 'granted') {
    const req = await csvFileHandle.requestPermission({ mode: 'readwrite' });
    if (req !== 'granted') return;
  }

  try {
    const w = await csvFileHandle.createWritable();
    await w.write(buildCSV());
    await w.close();
    setCsvInfo('torn_cars.csv', true);
    flash('Saved!');
  } catch (e) {
    console.error('Save failed:', e);
  }
}

}

function classOrder(c) { return { E: 0, D: 1, C: 2, B: 3, A: 4 }[c] ?? -1; }

function isVisible(car) {
  const got = !!obtained[car.id];
  if (filterClass !== 'all' && car.cls !== filterClass) return false;
  if (filterObtained === 'yes' && !got) return false;
  if (filterObtained === 'no'  &&  got) return false;
  return true;
}

function getSorted() {
  return [...cars].sort((a, b) => {
    let va, vb;
    if      (sortCol === 'name')     { va = a.name.toLowerCase();     vb = b.name.toLowerCase(); }
    else if (sortCol === 'class')    { va = classOrder(a.cls);         vb = classOrder(b.cls); }
    else if (sortCol === 'buy')      { va = a.buy  ?? -1;              vb = b.buy  ?? -1; }
    else if (sortCol === 'sell')     { va = a.sell ?? -1;              vb = b.sell ?? -1; }
    else if (sortCol === 'location') { va = a.location.toLowerCase();  vb = b.location.toLowerCase(); }
    else return 0;
    return va < vb ? (sortAsc ? -1 : 1) : va > vb ? (sortAsc ? 1 : -1) : 0;
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = getSorted().map(car => {
    const got  = !!obtained[car.id];
    const hide = isVisible(car) ? '' : 'hidden-row';
    return `<tr class="class-${car.cls} ${got ? 'obtained' : ''} ${hide}" data-id="${car.id}">
      <td class="img-cell"><img src="${imgSrc(car.id)}" alt="${car.name}" loading="lazy"></td>
      <td class="name-cell">${car.name}</td>
      <td class="location-cell">${car.location}</td>
      <td><span class="class-badge">Class ${car.cls}</span></td>
      <td>${fmt(car.buy)}</td>
      <td>${fmt(car.sell)}</td>
      <td class="obtained-cell">
        <label class="check-wrap">
          <input type="checkbox" data-id="${car.id}" ${got ? 'checked' : ''}>
        </label>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      if (e.target.checked) obtained[id] = true;
      else delete obtained[id];
      updateProgress();
      renderTable();
    });
  });
}

function updateProgress() {
  const total = cars.length;
  const done  = Object.keys(obtained).length;
  document.getElementById('progressFill').style.width = Math.round(done / total * 100) + '%';
  document.getElementById('progressCount').textContent = `${done} / ${total}`;
  document.getElementById('classStats').innerHTML = ['E','D','C','B','A'].map(cls => {
    const all = cars.filter(c => c.cls === cls);
    const got = all.filter(c => obtained[c.id]);
    return `<span class="class-stat-chip chip-${cls}">Class ${cls}: ${got.length}/${all.length}</span>`;
  }).join('');
}

function updateSortHeaders() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sorted');
    th.querySelector('.sort-icon').innerHTML = '&#9650;';
    if (th.dataset.col === sortCol) {
      th.classList.add('sorted');
      th.querySelector('.sort-icon').innerHTML = sortAsc ? '&#9650;' : '&#9660;';
    }
  });
}

// ---- Button handlers ----
document.getElementById('saveBtn').addEventListener('click', saveToCSV);

document.getElementById('exportBtn').addEventListener('click', async () => {
  const csv = buildCSV();
  if ('showSaveFilePicker' in window) {
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: 'torn_cars.csv',
        types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
      });
      const w = await fh.createWritable();
      await w.write(csv); await w.close();
      flash('Exported!');
    } catch (e) { if (e.name !== 'AbortError') console.error(e); }
  } else {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    Object.assign(document.createElement('a'), { href: url, download: 'torn_cars.csv' }).click();
    URL.revokeObjectURL(url);
    flash('Exported!');
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all obtained checkboxes?')) {
    obtained = {};
    updateProgress();
    renderTable();
  }
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    parseCSV(ev.target.result);
    setCsvInfo(file.name, true);
    updateProgress();
    renderTable();
    flash('Imported!');
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.querySelectorAll('.filter-btn[data-group]').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`.filter-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (group === 'class')    filterClass    = btn.dataset.val;
    if (group === 'obtained') filterObtained = btn.dataset.val;
    renderTable();
  });
});

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol === th.dataset.col) sortAsc = !sortAsc;
    else { sortCol = th.dataset.col; sortAsc = true; }
    updateSortHeaders();
    renderTable();
  });
});

// ---- Init ----
updateSortHeaders();
loadFromCSV().then(() => {
  renderTable();
  updateProgress();
});
</script>
</body>
</html>
